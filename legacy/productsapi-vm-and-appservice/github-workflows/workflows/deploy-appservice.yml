name: Deploy API to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Requerido: permite a este workflow pedir un token OIDC a GitHub
  contents: read

env:
  AZURE_WEBAPP_NAME: productsapi-dennis-paas

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ProductsApi.csproj

      - name: Build
        run: dotnet build ProductsApi.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ProductsApi.csproj --configuration Release --no-build --output ./publish

      - name: Azure login (OIDC, sin secrets de larga duración)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
