name: Validate infrastructure (PR check)

# Runs on EVERY PR (no path filter on the trigger itself) — if this workflow
# only triggered for infra/ changes, any PR that doesn't touch infra/ would
# get stuck waiting forever for a required check that never runs (a real
# gotcha — see docs/AZURE-LEARNING-GUIDE.md). Instead: a cheap job always
# detects whether infra/ changed, and the real "what-if" job is gated at the
# JOB level on that result. A job skipped via `if:` is reported by GitHub as
# "skipped", which counts as a pass for required status checks — so the
# check always resolves one way or another, without conditioning every step.
on:
  pull_request:

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'infra/**'

  what-if:
    needs: detect-changes
    if: needs.detect-changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    environment: dev   # validate against dev's subscription/resource group
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep build (catches syntax errors fast, before what-if)
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

      - name: What-if against dev
        run: |
          echo "## Bicep what-if (dev)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          az deployment group what-if \
            --resource-group rg-microservices \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.parameters.json \
            --no-pretty-print >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
