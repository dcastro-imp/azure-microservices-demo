name: Deploy infrastructure (dev -> staging -> prod)

# Runs automatically whenever infra/ changes land on main (i.e. right after a
# PR is merged — see validate-infra.yml for what runs BEFORE merge, on the PR
# itself). "Automatic" only means the workflow STARTS on its own; staging and
# prod still pause for a human to click "Approve" via each GitHub Environment's
# required reviewers — nobody needs to manually trigger anything, but nothing
# reaches prod without an explicit human decision either.
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
  workflow_dispatch:   # still available as a manual override/re-run button

permissions:
  id-token: write   # required for OIDC login to Azure — no stored secrets/passwords
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev   # ties to a GitHub "Environment" — no approval required for dev
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC, no secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          for pair in "ProductsApi:productsapi" "InventoryWorker:inventoryworker" "ShippingWorker:shippingworker" "NotificationWorker:notificationworker" "AuditWorker:auditworker"; do
            SRC="${pair%%:*}"; IMG="${pair##*:}"
            docker build -t ${{ vars.ACR_NAME }}.azurecr.io/$IMG:dev src/$SRC
            docker push ${{ vars.ACR_NAME }}.azurecr.io/$IMG:dev
          done

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group rg-microservices \
            --template-file infra/main.bicep \
            --parameters infra/environments/dev.parameters.json

  deploy-staging:
    runs-on: ubuntu-latest
    needs: deploy-dev              # won't even start until dev succeeds
    environment: staging           # GitHub prompts for manual approval here (configured in repo settings)
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          for pair in "ProductsApi:productsapi" "InventoryWorker:inventoryworker" "ShippingWorker:shippingworker" "NotificationWorker:notificationworker" "AuditWorker:auditworker"; do
            SRC="${pair%%:*}"; IMG="${pair##*:}"
            docker build -t ${{ vars.ACR_NAME }}.azurecr.io/$IMG:staging src/$SRC
            docker push ${{ vars.ACR_NAME }}.azurecr.io/$IMG:staging
          done

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group rg-microservices-staging \
            --template-file infra/main.bicep \
            --parameters infra/environments/staging.parameters.json

  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-staging           # the exact same commit that passed staging — never a different version
    environment: prod               # requires manual approval (configure required reviewers in repo settings)
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          for pair in "ProductsApi:productsapi" "InventoryWorker:inventoryworker" "ShippingWorker:shippingworker" "NotificationWorker:notificationworker" "AuditWorker:auditworker"; do
            SRC="${pair%%:*}"; IMG="${pair##*:}"
            docker build -t ${{ vars.ACR_NAME }}.azurecr.io/$IMG:prod src/$SRC
            docker push ${{ vars.ACR_NAME }}.azurecr.io/$IMG:prod
          done

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group rg-microservices-prod \
            --template-file infra/main.bicep \
            --parameters infra/environments/prod.parameters.json
